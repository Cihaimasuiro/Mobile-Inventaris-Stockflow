name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Secret Leaks
        run: |
          echo "Checking for committed secret or env files..."
          if [ -f .env ]; then
            echo "ERROR: .env file committed!"
            exit 1
          fi
          echo "Secret check passed."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Sebelum build_runner: file generated (*.g.dart) tidak ikut diperiksa formatnya.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code (Drift)
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage
