name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code & Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Secret Leaks
        run: |
          echo "Checking for committed secret or env files..."
          if [ -f .env ]; then
            echo "ERROR: .env file committed!"
            exit 1
          fi
          echo "Secret check passed."

      - name: Validate Line Endings & Formatting
        run: |
          echo "Checking files for syntax and editor consistency..."
          find . -maxdepth 3 -not -path '*/.*' -type f
